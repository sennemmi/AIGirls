name: Import ZipZipPipe portraits
on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/import-zipzippipe-art.yml
      - scripts/import_zipzippipe_art.py
      - data/portrait-sources.json
permissions:
  contents: write
jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/zipzippipe-source-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate full-resolution image set
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/import_zipzippipe_art.py
      - name: Commit only complete validated batch
        run: |
          git add characters/*/portrait.* data/artwork-verification.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets: add ten verified ZipZipPipe portraits'
          git push origin HEAD:docs/zipzippipe-source-audit
